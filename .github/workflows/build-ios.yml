name: Build RSDKv5U (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - ios
  pull_request:
    branches:
      - ios

jobs:
  v5u-ios:
    name: Build RSDKv5U for iOS
    runs-on: macos-15  # Apple Silicon — fastest Xcode builds on GH Actions

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── 2.5. Find Info.plist (debugging — remove after first run) ───────────
      - name: Find Info.plist
        run: |
          echo "Searching for Info.plist files..."
          find . -name "Info.plist" -not -path "*/.*" -not -path "*/Build/*" | head -10

      # ── 3. Patch Info.plist for Files app support ────────────────────────────
      - name: Patch Info.plist
        run: |
          # ⚠️ UPDATE THIS PATH after checking the "Find Info.plist" step output
          INFO_PLIST="dependencies/ios/Info.plist"
          
          # Verify the plist exists
          if [ ! -f "$INFO_PLIST" ]; then
            echo "ERROR: Info.plist not found at $INFO_PLIST"
            echo "Available Info.plist files:"
            find . -name "Info.plist" -not -path "*/.*" -not -path "*/Build/*"
            exit 1
          fi
          
          echo "Patching $INFO_PLIST for Files app support..."
          
          # Add Files app support keys (with error handling)
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$INFO_PLIST"
          
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$INFO_PLIST"
          
          # Verify the keys were added
          echo "Verifying plist modifications..."
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :LSSupportsOpeningDocumentsInPlace" "$INFO_PLIST"

      # ── 4. Build (unsigned — no Apple Developer account required) ────────────
      - name: Archive RSDKv5U
        run: |
          set -o pipefail
          
          xcodebuild archive \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ runner.temp }}/RSDKv5U.xcarchive" \
            RETRO_REVISION=3 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0

      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.html

      # ── 5. Package as IPA ────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          ARCHIVE="${{ runner.temp }}/RSDKv5U.xcarchive"
          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          IPA_DIR="${{ runner.temp }}/ipa"

          mkdir -p "$PAYLOAD_DIR" "$IPA_DIR"

          # Find the .app bundle produced by the archive step
          APP=$(find "$ARCHIVE/Products" -name "*.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in archive. Archive contents:"
            find "$ARCHIVE" -maxdepth 4
            exit 1
          fi
          
          echo "Found app bundle: $APP"

          cp -r "$APP" "$PAYLOAD_DIR/"
          cd "${{ runner.temp }}"
          zip -qr "$IPA_DIR/RSDKv5U.ipa" Payload
          echo "IPA: $IPA_DIR/RSDKv5U.ipa ($(du -sh "$IPA_DIR/RSDKv5U.ipa" | cut -f1))"
          
          # Verify the IPA contains our plist modifications
          echo "Verifying Files app support in IPA..."
          unzip -p "$IPA_DIR/RSDKv5U.ipa" 'Payload/*.app/Info.plist' | \
            plutil -p - | grep -E "UIFileSharingEnabled|LSSupportsOpeningDocumentsInPlace" || \
            echo "Warning: Could not verify plist keys in IPA"

      # ── 6. Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5U-ios-unsigned
          path: ${{ runner.temp }}/ipa/RSDKv5U.ipa
          retention-days: 14
