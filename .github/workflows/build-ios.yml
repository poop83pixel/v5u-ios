name: Build RSDKv5U (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - ios
  pull_request:
    branches:
      - ios

jobs:
  v5u-ios:
    name: Build RSDKv5U for iOS
    runs-on: macos-14  # Apple Silicon — fastest Xcode builds on GH Actions

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      - name: Select Xcode
        # Xcode 15+ ships on macos-14; pin a specific version if you need one.
        # Run `ls /Applications/Xcode*` on the runner to see what's available.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

            # ── 2.5. Patch Xcode project for Metal support ───────────────────────────
      - name: Add Metal framework and shaders to Xcode project
        run: |
          PROJECT_FILE="RSDKv5.xcodeproj/project.pbxproj"
          
          # Backup original
          cp "$PROJECT_FILE" "$PROJECT_FILE.backup"
          
          echo "Current state of Metal-related entries:"
          grep -c "SDL2MetalShaders" "$PROJECT_FILE" || echo "0 SDL2MetalShaders entries"
          grep -c "SDL_render_metal" "$PROJECT_FILE" || echo "0 SDL_render_metal entries"
          grep -c "Metal.framework" "$PROJECT_FILE" || echo "0 Metal.framework entries"
          
          # ── Step 1: Remove ALL previous patch attempts ───────────────────────
          echo ""
          echo "Removing any previous patch attempts..."
          
          # We'll rebuild from the git-clean version of the project file
          git checkout -- "$PROJECT_FILE" 2>/dev/null || true
          
          # Verify clean state
          echo "After git checkout:"
          grep -c "SDL2MetalShaders" "$PROJECT_FILE" 2>/dev/null && echo " SDL2MetalShaders entries found" || echo " 0 SDL2MetalShaders entries"
          grep -c "SDL_render_metal" "$PROJECT_FILE" 2>/dev/null && echo " SDL_render_metal entries found" || echo " 0 SDL_render_metal entries"
          grep -c "Metal.framework" "$PROJECT_FILE" 2>/dev/null && echo " Metal.framework entries found" || echo " 0 Metal.framework entries"
          
          # ── Step 2: Verify source files exist ───────────────────────────────
          METAL_SHADERS_FILE="RSDKv5/RSDK/Graphics/SDL2/SDL2MetalShaders.mm"
          METAL_DIR="dependencies/ios/SDL/src/render/metal"
          
          for f in "$METAL_SHADERS_FILE" \
                   "$METAL_DIR/SDL_render_metal.m" \
                   "$METAL_DIR/SDL_shaders_metal.metal"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing file: $f"
              exit 1
            fi
            echo "✓ $f"
          done
          
          # ── Step 3: Check what already exists in the project ─────────────────
          echo ""
          echo "Checking existing project entries..."
          
          HAS_SHADERS=$(grep -c "SDL2MetalShaders.mm" "$PROJECT_FILE" || echo "0")
          HAS_RENDER=$(grep -c "SDL_render_metal.m" "$PROJECT_FILE" || echo "0")
          HAS_METAL_FW=$(grep -c "Metal.framework" "$PROJECT_FILE" || echo "0")
          
          echo "  SDL2MetalShaders.mm entries: $HAS_SHADERS"
          echo "  SDL_render_metal.m entries:  $HAS_RENDER"
          echo "  Metal.framework entries:     $HAS_METAL_FW"
          
          # Known sources phase ID from diagnostic output
          SOURCES_PHASE_ID="F2FD447928C3E07E003A887A"
          FRAMEWORKS_PHASE_ID="F2FD447A28C3E07E003A887A"
          
          echo ""
          echo "Sources phase:    $SOURCES_PHASE_ID"
          echo "Frameworks phase: $FRAMEWORKS_PHASE_ID"
          
          # ── Step 4: Add SDL2MetalShaders.mm if not present ───────────────────
          if [ "$HAS_SHADERS" -eq 0 ]; then
            echo ""
            echo "Adding SDL2MetalShaders.mm..."
            
            SHADERS_FILE_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            SHADERS_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            
            # File reference
            sed -i '' '/\/\* Begin PBXFileReference section \*\//a\
            \		'"$SHADERS_FILE_ID"' /* SDL2MetalShaders.mm */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = sourcecode.cpp.objcpp; name = SDL2MetalShaders.mm; path = RSDKv5/RSDK/Graphics/SDL2/SDL2MetalShaders.mm; sourceTree = SOURCE_ROOT; };
            ' "$PROJECT_FILE"
            
            # Build file
            sed -i '' '/\/\* Begin PBXBuildFile section \*\//a\
            \		'"$SHADERS_BUILD_ID"' /* SDL2MetalShaders.mm in Sources */ = {isa = PBXBuildFile; fileRef = '"$SHADERS_FILE_ID"' /* SDL2MetalShaders.mm */; };
            ' "$PROJECT_FILE"
            
            # Add to sources phase
            awk -v phase="$SOURCES_PHASE_ID" -v build="$SHADERS_BUILD_ID" '
              $1 == phase { in_phase = 1 }
              in_phase && /files = \(/ { 
                print
                print "\t\t\t\t" build " /* SDL2MetalShaders.mm in Sources */,"
                next
              }
              { print }
            ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp" && mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
            
            echo "  ✓ SDL2MetalShaders.mm added"
          else
            echo "  ✓ SDL2MetalShaders.mm already present"
          fi
          
          # ── Step 5: Add SDL_render_metal.m if not present ────────────────────
          if [ "$HAS_RENDER" -eq 0 ]; then
            echo ""
            echo "Adding SDL_render_metal.m..."
            
            RENDER_FILE_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            RENDER_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            
            # File reference
            sed -i '' '/\/\* Begin PBXFileReference section \*\//a\
            \		'"$RENDER_FILE_ID"' /* SDL_render_metal.m */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = sourcecode.c.objc; name = SDL_render_metal.m; path = dependencies/ios/SDL/src/render/metal/SDL_render_metal.m; sourceTree = SOURCE_ROOT; };
            ' "$PROJECT_FILE"
            
            # Build file
            sed -i '' '/\/\* Begin PBXBuildFile section \*\//a\
            \		'"$RENDER_BUILD_ID"' /* SDL_render_metal.m in Sources */ = {isa = PBXBuildFile; fileRef = '"$RENDER_FILE_ID"' /* SDL_render_metal.m */; };
            ' "$PROJECT_FILE"
            
            # Add to sources phase
            awk -v phase="$SOURCES_PHASE_ID" -v build="$RENDER_BUILD_ID" '
              $1 == phase { in_phase = 1 }
              in_phase && /files = \(/ { 
                print
                print "\t\t\t\t" build " /* SDL_render_metal.m in Sources */,"
                next
              }
              { print }
            ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp" && mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
            
            echo "  ✓ SDL_render_metal.m added"
          else
            echo "  ✓ SDL_render_metal.m already present"
          fi
          
          # ── Step 6: Add Metal.framework if not present ───────────────────────
          if [ "$HAS_METAL_FW" -eq 0 ]; then
            echo ""
            echo "Adding Metal.framework..."
            
            METAL_FW_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            METAL_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            
            # File reference
            sed -i '' '/\/\* Begin PBXFileReference section \*\//a\
            \		'"$METAL_FW_ID"' /* Metal.framework */ = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = Metal.framework; path = System/Library/Frameworks/Metal.framework; sourceTree = SDKROOT; };
            ' "$PROJECT_FILE"
            
            # Build file
            sed -i '' '/\/\* Begin PBXBuildFile section \*\//a\
            \		'"$METAL_BUILD_ID"' /* Metal.framework in Frameworks */ = {isa = PBXBuildFile; fileRef = '"$METAL_FW_ID"' /* Metal.framework */; };
            ' "$PROJECT_FILE"
            
            # Add to frameworks phase (NOT sources phase)
            awk -v phase="$FRAMEWORKS_PHASE_ID" -v build="$METAL_BUILD_ID" '
              $1 == phase { in_phase = 1 }
              in_phase && /files = \(/ { 
                print
                print "\t\t\t\t" build " /* Metal.framework in Frameworks */,"
                next
              }
              { print }
            ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp" && mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
            
            echo "  ✓ Metal.framework added to Frameworks phase"
          else
            echo "  ✓ Metal.framework already present"
          fi
          
          # ── Step 7: Verify final state ───────────────────────────────────────
          echo ""
          echo "=== Final verification ==="
          
          # Check entries exist
          grep -q "SDL2MetalShaders.mm in Sources" "$PROJECT_FILE" && \
            echo "✓ SDL2MetalShaders.mm in Sources" || echo "✗ SDL2MetalShaders.mm MISSING from Sources"
          
          grep -q "SDL_render_metal.m in Sources" "$PROJECT_FILE" && \
            echo "✓ SDL_render_metal.m in Sources" || echo "✗ SDL_render_metal.m MISSING from Sources"
          
          grep -q "Metal.framework in Frameworks" "$PROJECT_FILE" && \
            echo "✓ Metal.framework in Frameworks" || echo "✗ Metal.framework MISSING from Frameworks"
          
          # Check no duplicates
          SHADERS_COUNT=$(grep -c "SDL2MetalShaders.mm in Sources" "$PROJECT_FILE" || echo "0")
          RENDER_COUNT=$(grep -c "SDL_render_metal.m in Sources" "$PROJECT_FILE" || echo "0")
          METAL_COUNT=$(grep -c "Metal.framework in Frameworks" "$PROJECT_FILE" || echo "0")
          
          echo ""
          echo "Entry counts (should all be 1 or 2):"
          echo "  SDL2MetalShaders.mm in Sources: $SHADERS_COUNT"
          echo "  SDL_render_metal.m in Sources:  $RENDER_COUNT"
          echo "  Metal.framework in Frameworks:  $METAL_COUNT"
          
          if [ "$SHADERS_COUNT" -gt 2 ] || [ "$RENDER_COUNT" -gt 2 ] || [ "$METAL_COUNT" -gt 2 ]; then
            echo ""
            echo "WARNING: Duplicate entries detected!"
          else
            echo ""
            echo "✓ No duplicates detected"
          fi
          
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "✓ Metal support configuration complete"
          echo "═══════════════════════════════════════════════════════"


      - name: Diagnose preprocessor and Metal framework
        run: |
          PROJECT_FILE="RSDKv5.xcodeproj/project.pbxproj"
          
          echo "=== GCC_PREPROCESSOR_DEFINITIONS block ==="
          awk '/GCC_PREPROCESSOR_DEFINITIONS/,/\);/' "$PROJECT_FILE" | head -30
          
          echo ""
          echo "=== Metal.framework in Frameworks phase ==="
          awk '/F2FD447A28C3E07E003A887A.*Frameworks/,/\};/' "$PROJECT_FILE" | head -30
          
          echo ""
          echo "=== All Metal.framework references ==="
          grep -n "Metal.framework" "$PROJECT_FILE"
          
          echo ""
          echo "=== SDL2MetalShaders.mm - check if TARGET_OS_IPHONE is set ==="
          head -5 RSDKv5/RSDK/Graphics/SDL2/SDL2MetalShaders.mm
      # ── 2.6. Verify Metal files are in compile sources ──────────────────────
      - name: Verify compilation setup
        run: |
          echo "Checking if Metal files will be compiled..."
          
          if grep -q "SDL2MetalShaders.mm in Sources" RSDKv5.xcodeproj/project.pbxproj; then
            echo "✓ SDL2MetalShaders.mm found in Sources phase"
          else
            echo "✗ SDL2MetalShaders.mm NOT in Sources phase"
          fi
          
          if grep -q "SDL_render_metal.m in Sources" RSDKv5.xcodeproj/project.pbxproj; then
            echo "✓ SDL_render_metal.m found in Sources phase"
          else
            echo "✗ SDL_render_metal.m NOT in Sources phase"
          fi
          
          if grep -q "Metal.framework in Frameworks" RSDKv5.xcodeproj/project.pbxproj; then
            echo "✓ Metal.framework found in Frameworks phase"
          else
            echo "✗ Metal.framework NOT in Frameworks phase"
          fi
          
      # ── 3. Build (unsigned — no Apple Developer account required) ────────────
      - name: Archive RSDKv5U
        run: |
          xcodebuild archive \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ runner.temp }}/RSDKv5U.xcarchive" \
            RETRO_REVISION=3 \
            INFOPLIST_FILE="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) TARGET_OS_IPHONE=1' \
            | xcpretty || true

      # ── 4. Package as IPA ────────────────────────────────────────────────────
      # Because the build is unsigned we skip xcodebuild -exportArchive and
      # assemble the IPA ourselves from the Products directory in the archive.
      - name: Package IPA
        run: |
          ARCHIVE="${{ runner.temp }}/RSDKv5U.xcarchive"
          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          IPA_DIR="${{ runner.temp }}/ipa"

          mkdir -p "$PAYLOAD_DIR" "$IPA_DIR"

          # Find the .app bundle produced by the archive step
          APP=$(find "$ARCHIVE/Products" -name "*.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in archive. Archive contents:"
            find "$ARCHIVE" -maxdepth 4
            exit 1
          fi

          cp -r "$APP" "$PAYLOAD_DIR/"
          cd "${{ runner.temp }}"
          zip -qr "$IPA_DIR/RSDKv5U.ipa" Payload
          echo "IPA: $IPA_DIR/RSDKv5U.ipa ($(du -sh "$IPA_DIR/RSDKv5U.ipa" | cut -f1))"

      # ── 5. Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5U-ios-unsigned
          path: ${{ runner.temp }}/ipa/RSDKv5U.ipa
          retention-days: 14

