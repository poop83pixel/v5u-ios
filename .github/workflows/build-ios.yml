name: Build RSDKv5U (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - ios
  pull_request:
    branches:
      - ios

jobs:
  v5u-ios:
    name: Build RSDKv5U for iOS
    runs-on: macos-14  # Apple Silicon — fastest Xcode builds on GH Actions

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      - name: Select Xcode
        # Xcode 15+ ships on macos-14; pin a specific version if you need one.
        # Run `ls /Applications/Xcode*` on the runner to see what's available.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── 2.5. Patch Xcode project for Metal support ───────────────────────────
      - name: Add Metal framework and shaders to Xcode project
        run: |
          PROJECT_FILE="RSDKv5.xcodeproj/project.pbxproj"
          
          # Backup original
          cp "$PROJECT_FILE" "$PROJECT_FILE.backup"
          
          echo "Adding Metal support to Xcode project..."
          
          # Files to add
          METAL_SHADERS_FILE="RSDKv5/RSDK/Graphics/SDL2/SDL2MetalShaders.mm"
          METAL_DIR="dependencies/ios/SDL/src/render/metal"
          
          # Verify files exist
          if [ ! -f "$METAL_SHADERS_FILE" ]; then
            echo "ERROR: SDL2MetalShaders.mm not found at $METAL_SHADERS_FILE"
            exit 1
          fi
          
          if [ ! -d "$METAL_DIR" ]; then
            echo "ERROR: SDL Metal directory not found at $METAL_DIR"
            exit 1
          fi
          
          echo "✓ Found SDL2MetalShaders.mm"
          echo "✓ Found SDL Metal directory"
          
          # Collect all files to add
          FILES_TO_ADD=(
            "$METAL_SHADERS_FILE"
            "$METAL_DIR/SDL_render_metal.m"
            "$METAL_DIR/SDL_shaders_metal.metal"
          )
          
          echo ""
          echo "Files to add to Xcode project:"
          for file in "${FILES_TO_ADD[@]}"; do
            if [ -f "$file" ]; then
              echo "  ✓ $file"
            else
              echo "  ✗ $file (NOT FOUND)"
              exit 1
            fi
          done
          
          # Generate IDs for Metal.framework
          METAL_FW_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          METAL_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          
          echo ""
          echo "Adding files to Xcode project..."
          
          # Track build IDs to verify later
          declare -a BUILD_IDS
          
          # Add each file
          for file_path in "${FILES_TO_ADD[@]}"; do
            FILE_NAME=$(basename "$file_path")
            FILE_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            
            BUILD_IDS+=("$BUILD_ID")
            
            # Determine file type
            if [[ "$FILE_NAME" == *.metal ]]; then
              FILE_TYPE="sourcecode.metal"
            elif [[ "$FILE_NAME" == *.mm ]]; then
              FILE_TYPE="sourcecode.cpp.objcpp"
            elif [[ "$FILE_NAME" == *.m ]]; then
              FILE_TYPE="sourcecode.c.objc"
            else
              FILE_TYPE="sourcecode"
            fi
            
            echo "  $FILE_NAME"
            echo "    File ID:  $FILE_ID"
            echo "    Build ID: $BUILD_ID"
            
            # Add file reference
            sed -i '' '/\/\* Begin PBXFileReference section \*\//a\
            \		'"$FILE_ID"' /* '"$FILE_NAME"' */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = '"$FILE_TYPE"'; name = '"$FILE_NAME"'; path = '"$file_path"'; sourceTree = SOURCE_ROOT; };
            ' "$PROJECT_FILE"
            
            # Add build file
            sed -i '' '/\/\* Begin PBXBuildFile section \*\//a\
            \		'"$BUILD_ID"' /* '"$FILE_NAME"' in Sources */ = {isa = PBXBuildFile; fileRef = '"$FILE_ID"' /* '"$FILE_NAME"' */; };
            ' "$PROJECT_FILE"
          done
          
          # Now add all build IDs to the RSDKv5 target's sources phase
          # First, find the RSDKv5 target's PBXSourcesBuildPhase
          echo ""
          echo "Finding RSDKv5 target's sources phase..."
          
          # Extract the RSDKv5 target ID - look for the native target
          RSDK_TARGET_ID=$(grep -F "PBXNativeTarget" "$PROJECT_FILE" | grep -F "RSDKv5" | head -1 | awk '{print $1}')
          echo "  RSDKv5 target ID: $RSDK_TARGET_ID"
          
          if [ -z "$RSDK_TARGET_ID" ]; then
            echo "  Could not find via PBXNativeTarget, searching differently..."
            # Alternative: search for the target by name comment
            RSDK_TARGET_ID=$(awk '/\/\* RSDKv5 \*\/ = \{/,/^[ \t]*\};/ { if (/isa = PBXNativeTarget/) { print prev } } { prev=$1 }' "$PROJECT_FILE" | head -1)
            echo "  RSDKv5 target ID (alt): $RSDK_TARGET_ID"
          fi
          
          if [ -z "$RSDK_TARGET_ID" ]; then
            echo "ERROR: Could not find RSDKv5 target ID"
            echo "Searching for all native targets:"
            grep "isa = PBXNativeTarget" "$PROJECT_FILE" | head -5
            exit 1
          fi
          
          # Find the sources build phase ID for this target
          SOURCES_PHASE_ID=$(awk "/$RSDK_TARGET_ID/,/};/" "$PROJECT_FILE" | grep "PBXSourcesBuildPhase" | head -1 | awk '{print $1}')
          echo "  Sources phase ID: $SOURCES_PHASE_ID"
          
          if [ -z "$SOURCES_PHASE_ID" ]; then
            echo "ERROR: Could not find RSDKv5 sources build phase"
            echo "Target block:"
            awk "/$RSDK_TARGET_ID/,/};" "$PROJECT_FILE" | head -30
            exit 1
          fi
          
          # Add our files to this specific sources phase
          echo ""
          echo "Adding to sources phase..."
          for i in "${!BUILD_IDS[@]}"; do
            BUILD_ID="${BUILD_IDS[$i]}"
            FILE_NAME=$(basename "${FILES_TO_ADD[$i]}")
            echo "  Adding $FILE_NAME ($BUILD_ID)"
            
            # Find the line with this sources phase and its files array
            awk -v phase_id="$SOURCES_PHASE_ID" -v build_id="$BUILD_ID" -v file_name="$FILE_NAME" '
              $1 == phase_id && /Sources/ { in_phase=1 }
              in_phase && /files = \(/ { in_files=1; print; next }
              in_files && !added && /\);/ {
                print "\t\t\t\t" build_id " /* " file_name " in Sources */,"
                added=1
              }
              { print }
            ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp"
            mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
          done
          
          # Add Metal.framework
          echo ""
          echo "Adding Metal.framework..."
          echo "  Framework ID: $METAL_FW_ID"
          echo "  Build ID:     $METAL_BUILD_ID"
          
          sed -i '' '/\/\* Begin PBXFileReference section \*\//a\
          \		'"$METAL_FW_ID"' /* Metal.framework */ = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = Metal.framework; path = System/Library/Frameworks/Metal.framework; sourceTree = SDKROOT; };
          ' "$PROJECT_FILE"
          
          sed -i '' '/\/\* Begin PBXBuildFile section \*\//a\
          \		'"$METAL_BUILD_ID"' /* Metal.framework in Frameworks */ = {isa = PBXBuildFile; fileRef = '"$METAL_FW_ID"' /* Metal.framework */; };
          ' "$PROJECT_FILE"
          
          # Find RSDKv5's frameworks phase
          FRAMEWORKS_PHASE_ID=$(awk "/$RSDK_TARGET_ID/,/};/" "$PROJECT_FILE" | grep "PBXFrameworksBuildPhase" | head -1 | awk '{print $1}')
          echo "  Frameworks phase ID: $FRAMEWORKS_PHASE_ID"
          
          awk -v phase_id="$FRAMEWORKS_PHASE_ID" -v metal_id="$METAL_BUILD_ID" '
            $1 == phase_id && /Frameworks/ { in_phase=1 }
            in_phase && /files = \(/ { in_files=1; print; next }
            in_files && !added && /\);/ {
              print "\t\t\t\t" metal_id " /* Metal.framework in Frameworks */,"
              added=1
            }
            { print }
          ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp"
          mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
          
          echo ""
          echo "Verifying additions..."
          
          # Check if our files appear in the sources phase
          for i in "${!BUILD_IDS[@]}"; do
            BUILD_ID="${BUILD_IDS[$i]}"
            FILE_NAME=$(basename "${FILES_TO_ADD[$i]}")
            if grep -q "$BUILD_ID" "$PROJECT_FILE"; then
              echo "  ✓ $FILE_NAME ($BUILD_ID) added to project"
            else
              echo "  ✗ $FILE_NAME ($BUILD_ID) MISSING from project"
            fi
          done
          
          if grep -q "MetalShaders_FlipScreen" "RSDKv5/RSDK/Graphics/SDL2/SDL2MetalShaders.mm"; then
            echo "  ✓ SDL2MetalShaders.mm contains MetalShaders_FlipScreen"
          fi
          
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "✓ Metal support configuration complete"
          echo "═══════════════════════════════════════════════════════"

          
      # ── 3. Build (unsigned — no Apple Developer account required) ────────────
      - name: Archive RSDKv5U
        run: |
          xcodebuild archive \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ runner.temp }}/RSDKv5U.xcarchive" \
            RETRO_REVISION=3 \
            INFOPLIST_FILE="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true   # xcpretty is pre-installed on macos-14 runners

      # ── 4. Package as IPA ────────────────────────────────────────────────────
      # Because the build is unsigned we skip xcodebuild -exportArchive and
      # assemble the IPA ourselves from the Products directory in the archive.
      - name: Package IPA
        run: |
          ARCHIVE="${{ runner.temp }}/RSDKv5U.xcarchive"
          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          IPA_DIR="${{ runner.temp }}/ipa"

          mkdir -p "$PAYLOAD_DIR" "$IPA_DIR"

          # Find the .app bundle produced by the archive step
          APP=$(find "$ARCHIVE/Products" -name "*.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in archive. Archive contents:"
            find "$ARCHIVE" -maxdepth 4
            exit 1
          fi

          cp -r "$APP" "$PAYLOAD_DIR/"
          cd "${{ runner.temp }}"
          zip -qr "$IPA_DIR/RSDKv5U.ipa" Payload
          echo "IPA: $IPA_DIR/RSDKv5U.ipa ($(du -sh "$IPA_DIR/RSDKv5U.ipa" | cut -f1))"

      # ── 5. Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5U-ios-unsigned
          path: ${{ runner.temp }}/ipa/RSDKv5U.ipa
          retention-days: 14

