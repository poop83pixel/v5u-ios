name: Build RSDKv5U (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - ios
  pull_request:
    branches:
      - ios

jobs:
  v5u-ios:
    name: Build RSDKv5U for iOS
    runs-on: macos-14  # Apple Silicon — fastest Xcode builds on GH Actions

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      - name: Select Xcode
        # Xcode 15+ ships on macos-14; pin a specific version if you need one.
        # Run `ls /Applications/Xcode*` on the runner to see what's available.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

            # ── 2.5. Patch Xcode project for Metal support ───────────────────────────
      - name: Add Metal framework and shaders to Xcode project
        run: |
          PROJECT_FILE="RSDKv5.xcodeproj/project.pbxproj"
          
          # Backup original
          cp "$PROJECT_FILE" "$PROJECT_FILE.backup"
          
          echo "Adding Metal support to Xcode project..."
          
          # Files to add
          METAL_SHADERS_FILE="RSDKv5/RSDK/Graphics/SDL2/SDL2MetalShaders.mm"
          METAL_DIR="dependencies/ios/SDL/src/render/metal"
          
          # Verify files exist
          if [ ! -f "$METAL_SHADERS_FILE" ]; then
            echo "ERROR: SDL2MetalShaders.mm not found"
            exit 1
          fi
          
          if [ ! -d "$METAL_DIR" ]; then
            echo "ERROR: SDL Metal directory not found"
            exit 1
          fi
          
          echo "✓ Found SDL2MetalShaders.mm"
          echo "✓ Found SDL Metal directory"
          
          # Collect all files to add
          FILES_TO_ADD=(
            "$METAL_SHADERS_FILE"
            "$METAL_DIR/SDL_render_metal.m"
            "$METAL_DIR/SDL_shaders_metal.metal"
          )
          
          echo ""
          echo "Files to add:"
          for file in "${FILES_TO_ADD[@]}"; do
            echo "  ✓ $file"
          done
          
          # Generate IDs
          METAL_FW_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          METAL_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          
          echo ""
          echo "Adding files to Xcode project..."
          
          declare -a BUILD_IDS
          
          # Add each file
          for file_path in "${FILES_TO_ADD[@]}"; do
            FILE_NAME=$(basename "$file_path")
            FILE_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            
            BUILD_IDS+=("$BUILD_ID")
            
            # Determine file type
            if [[ "$FILE_NAME" == *.metal ]]; then
              FILE_TYPE="sourcecode.metal"
            elif [[ "$FILE_NAME" == *.mm ]]; then
              FILE_TYPE="sourcecode.cpp.objcpp"
            elif [[ "$FILE_NAME" == *.m ]]; then
              FILE_TYPE="sourcecode.c.objc"
            fi
            
            echo "  $FILE_NAME (ID: $FILE_ID, Build: $BUILD_ID)"
            
            # Add file reference
            sed -i '' '/\/\* Begin PBXFileReference section \*\//a\
            \		'"$FILE_ID"' /* '"$FILE_NAME"' */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = '"$FILE_TYPE"'; name = '"$FILE_NAME"'; path = '"$file_path"'; sourceTree = SOURCE_ROOT; };
            ' "$PROJECT_FILE"
            
            # Add build file
            sed -i '' '/\/\* Begin PBXBuildFile section \*\//a\
            \		'"$BUILD_ID"' /* '"$FILE_NAME"' in Sources */ = {isa = PBXBuildFile; fileRef = '"$FILE_ID"' /* '"$FILE_NAME"' */; };
            ' "$PROJECT_FILE"
          done
          
          echo ""
          echo "Finding RSDKv5 build phases..."
          
          # Find RSDKv5 target - look for the exact pattern
          RSDK_TARGET_ID=$(grep -n "RSDKv5 \*/" "$PROJECT_FILE" | grep "PBXNativeTarget" -B 5 | head -1 | cut -d: -f1 | xargs -I {} sed -n '{}p' "$PROJECT_FILE" | awk '{print $1}')
          
          # Alternative method - find all native targets and filter
          if [ -z "$RSDK_TARGET_ID" ]; then
            echo "  Using alternative target search..."
            RSDK_TARGET_ID=$(awk '
              /\/\* RSDKv5 \*\/ = \{/ { id = $1; checking = 1; next }
              checking && /isa = PBXNativeTarget/ { print id; exit }
              checking && /\}\;/ { checking = 0 }
            ' "$PROJECT_FILE")
          fi
          
          echo "  Target ID: $RSDK_TARGET_ID"
          
          if [ -z "$RSDK_TARGET_ID" ]; then
            echo "ERROR: Could not find RSDKv5 target"
            exit 1
          fi
          
          # Extract the buildPhases array from the target
          echo "  Extracting build phases..."
          SOURCES_PHASE_ID=$(awk -v tid="$RSDK_TARGET_ID" '
            $1 == tid { found_target = 1 }
            found_target && /buildPhases = \(/ { in_phases = 1; next }
            in_phases && /Sources/ { 
              gsub(/[^A-F0-9]/, "", $1)
              if (length($1) == 24) {
                print $1
                exit
              }
            }
            in_phases && /\);/ { exit }
          ' "$PROJECT_FILE")
          
          FRAMEWORKS_PHASE_ID=$(awk -v tid="$RSDK_TARGET_ID" '
            $1 == tid { found_target = 1 }
            found_target && /buildPhases = \(/ { in_phases = 1; next }
            in_phases && /Frameworks/ { 
              gsub(/[^A-F0-9]/, "", $1)
              if (length($1) == 24) {
                print $1
                exit
              }
            }
            in_phases && /\);/ { exit }
          ' "$PROJECT_FILE")
          
          echo "  Sources phase: $SOURCES_PHASE_ID"
          echo "  Frameworks phase: $FRAMEWORKS_PHASE_ID"
          
          if [ -z "$SOURCES_PHASE_ID" ]; then
            echo "ERROR: Could not find sources phase"
            echo "Target block:"
            grep -A 30 "^$RSDK_TARGET_ID" "$PROJECT_FILE"
            exit 1
          fi
          
          # Add to sources phase
          echo ""
          echo "Adding to Sources phase..."
          for i in "${!BUILD_IDS[@]}"; do
            BUILD_ID="${BUILD_IDS[$i]}"
            FILE_NAME=$(basename "${FILES_TO_ADD[$i]}")
            
            awk -v phase="$SOURCES_PHASE_ID" -v build="$BUILD_ID" -v name="$FILE_NAME" '
              $1 == phase { in_phase = 1 }
              in_phase && /files = \(/ { 
                print
                print "\t\t\t\t" build " /* " name " in Sources */,"
                next
              }
              { print }
            ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp"
            mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
            echo "  ✓ Added $FILE_NAME"
          done
          
          # Add Metal.framework
          echo ""
          echo "Adding Metal.framework..."
          
          sed -i '' '/\/\* Begin PBXFileReference section \*\//a\
          \		'"$METAL_FW_ID"' /* Metal.framework */ = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = Metal.framework; path = System/Library/Frameworks/Metal.framework; sourceTree = SDKROOT; };
          ' "$PROJECT_FILE"
          
          sed -i '' '/\/\* Begin PBXBuildFile section \*\//a\
          \		'"$METAL_BUILD_ID"' /* Metal.framework in Frameworks */ = {isa = PBXBuildFile; fileRef = '"$METAL_FW_ID"' /* Metal.framework */; };
          ' "$PROJECT_FILE"
          
          if [ -n "$FRAMEWORKS_PHASE_ID" ]; then
            awk -v phase="$FRAMEWORKS_PHASE_ID" -v build="$METAL_BUILD_ID" '
              $1 == phase { in_phase = 1 }
              in_phase && /files = \(/ { 
                print
                print "\t\t\t\t" build " /* Metal.framework in Frameworks */,"
                next
              }
              { print }
            ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp"
            mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
            echo "  ✓ Added Metal.framework to link phase"
          fi
          
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "✓ Metal support configuration complete"
          echo "═══════════════════════════════════════════════════════"


      - name: Diagnose sources phase contents
        run: |
          PROJECT_FILE="RSDKv5.xcodeproj/project.pbxproj"
          
          echo "=== Sources phase F2FD447928C3E07E003A887A contents ==="
          awk '/F2FD447928C3E07E003A887A.*Sources/,/End PBXSourcesBuildPhase/' "$PROJECT_FILE" | head -60
          
          echo ""
          echo "=== Native target F2FD447C28C3E07E003A887A block ==="
          awk '/F2FD447C28C3E07E003A887A/,/^\t\};/' "$PROJECT_FILE" | head -40
          
          echo ""
          echo "=== Build settings - check for TARGET_OS_IPHONE ==="
          grep -n "TARGET_OS_IPHONE\|SDKROOT\|IPHONEOS\|platform" "$PROJECT_FILE" | head -20
          
          echo ""
          echo "=== Check for OTHER_CFLAGS or preprocessor defs ==="
          grep -n "GCC_PREPROCESSOR\|OTHER_CFLAGS\|SWIFT_ACTIVE" "$PROJECT_FILE" | head -20
          
          echo ""
          echo "=== SDL2MetalShaders build file details ==="
          grep -A 3 "SDL2MetalShaders.mm in Sources" "$PROJECT_FILE"
          
          echo ""
          echo "=== Is SDL2MetalShaders in the RSDKv5 target's sources phase? ==="
          # Check if 6248D5D42CF7849A1E5679BF appears inside F2FD447928C3E07E003A887A
          awk '/F2FD447928C3E07E003A887A.*Sources/,/\};/' "$PROJECT_FILE" | grep "SDL2MetalShaders\|SDL_render_metal"

      # ── 2.6. Verify Metal files are in compile sources ──────────────────────
      - name: Verify compilation setup
        run: |
          echo "Checking if Metal files will be compiled..."
          
          if grep -q "SDL2MetalShaders.mm in Sources" RSDKv5.xcodeproj/project.pbxproj; then
            echo "✓ SDL2MetalShaders.mm found in Sources phase"
          else
            echo "✗ SDL2MetalShaders.mm NOT in Sources phase"
          fi
          
          if grep -q "SDL_render_metal.m in Sources" RSDKv5.xcodeproj/project.pbxproj; then
            echo "✓ SDL_render_metal.m found in Sources phase"
          else
            echo "✗ SDL_render_metal.m NOT in Sources phase"
          fi
          
          if grep -q "Metal.framework in Frameworks" RSDKv5.xcodeproj/project.pbxproj; then
            echo "✓ Metal.framework found in Frameworks phase"
          else
            echo "✗ Metal.framework NOT in Frameworks phase"
          fi
          
      # ── 3. Build (unsigned — no Apple Developer account required) ────────────
      - name: Archive RSDKv5U
        run: |
          xcodebuild archive \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ runner.temp }}/RSDKv5U.xcarchive" \
            RETRO_REVISION=3 \
            INFOPLIST_FILE="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true   # xcpretty is pre-installed on macos-14 runners

      # ── 4. Package as IPA ────────────────────────────────────────────────────
      # Because the build is unsigned we skip xcodebuild -exportArchive and
      # assemble the IPA ourselves from the Products directory in the archive.
      - name: Package IPA
        run: |
          ARCHIVE="${{ runner.temp }}/RSDKv5U.xcarchive"
          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          IPA_DIR="${{ runner.temp }}/ipa"

          mkdir -p "$PAYLOAD_DIR" "$IPA_DIR"

          # Find the .app bundle produced by the archive step
          APP=$(find "$ARCHIVE/Products" -name "*.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in archive. Archive contents:"
            find "$ARCHIVE" -maxdepth 4
            exit 1
          fi

          cp -r "$APP" "$PAYLOAD_DIR/"
          cd "${{ runner.temp }}"
          zip -qr "$IPA_DIR/RSDKv5U.ipa" Payload
          echo "IPA: $IPA_DIR/RSDKv5U.ipa ($(du -sh "$IPA_DIR/RSDKv5U.ipa" | cut -f1))"

      # ── 5. Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5U-ios-unsigned
          path: ${{ runner.temp }}/ipa/RSDKv5U.ipa
          retention-days: 14

