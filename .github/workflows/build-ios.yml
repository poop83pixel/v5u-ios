name: Build RSDKv5U (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - ios
  pull_request:
    branches:
      - ios

jobs:
  v5u-ios:
    name: Build RSDKv5U for iOS
    runs-on: macos-14  # Apple Silicon — fastest Xcode builds on GH Actions

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      - name: Select Xcode
        # Xcode 15+ ships on macos-14; pin a specific version if you need one.
        # Run `ls /Applications/Xcode*` on the runner to see what's available.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

            # ── 2.5. Patch Xcode project for Metal support ───────────────────────────
      - name: Add Metal framework and shaders to Xcode project
        run: |
          PROJECT_FILE="RSDKv5.xcodeproj/project.pbxproj"
          
          # Backup original
          cp "$PROJECT_FILE" "$PROJECT_FILE.backup"
          
          # Search for Metal-related files in SDL
          echo "Searching for SDL Metal files..."
          
          # Try different possible locations
          POSSIBLE_PATHS=(
            "dependencies/ios/SDL/src/render/metal"
            "dependencies/ios/SDL2/src/render/metal"
            "dependencies/all/SDL/src/render/metal"
            "dependencies/SDL/src/render/metal"
          )
          
          METAL_DIR=""
          for path in "${POSSIBLE_PATHS[@]}"; do
            if [ -d "$path" ]; then
              METAL_DIR="$path"
              echo "✓ Found Metal directory: $METAL_DIR"
              break
            fi
          done
          
          if [ -z "$METAL_DIR" ]; then
            echo "Metal directory not found in expected locations."
            echo "Searching for SDL..."
            find dependencies -type d -name SDL -o -name SDL2 2>/dev/null | head -5 || true
            
            echo ""
            echo "WARNING: Metal renderer source files not found."
            echo "Adding Metal.framework only (Metal may be pre-compiled in SDL)..."
            SKIP_METAL_FILE=1
          else
            echo "Contents of $METAL_DIR:"
            ls -la "$METAL_DIR" 2>/dev/null || true
            
            # Find the actual Metal shader/implementation file
            SHADER_FILE=""
            FILE_TYPE=""
            
            if [ -f "$METAL_DIR/SDL_shaders_metal.metal" ]; then
              SHADER_FILE="SDL_shaders_metal.metal"
              FILE_TYPE="sourcecode.metal"
            elif [ -f "$METAL_DIR/SDL_render_metal.m" ]; then
              SHADER_FILE="SDL_render_metal.m"
              FILE_TYPE="sourcecode.c.objc"
            elif [ -f "$METAL_DIR/SDL_shaders_metal_osx.h" ] || [ -f "$METAL_DIR/SDL_shaders_metal_ios.h" ]; then
              # Sometimes shaders are embedded as headers
              echo "Metal shaders found as header (already included)"
              SKIP_METAL_FILE=1
            else
              echo "Metal directory exists but no standalone shader files found."
              echo "Files in directory:"
              ls "$METAL_DIR" 2>/dev/null || true
              SKIP_METAL_FILE=1
            fi
            
            if [ -n "$SHADER_FILE" ]; then
              SHADER_PATH="$METAL_DIR/$SHADER_FILE"
              echo "✓ Found Metal file: $SHADER_FILE (type: $FILE_TYPE)"
            fi
          fi
          
          # Generate unique IDs
          METAL_FW_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          METAL_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          
          echo ""
          echo "Generated IDs:"
          echo "  Metal framework: $METAL_FW_ID"
          echo "  Metal build:     $METAL_BUILD_ID"
          
          # Only add Metal source file if we found one
          if [ "$SKIP_METAL_FILE" != "1" ] && [ -n "$SHADER_FILE" ]; then
            SHADER_FILE_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            SHADER_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            
            echo "  Shader file:     $SHADER_FILE_ID"
            echo "  Shader build:    $SHADER_BUILD_ID"
            
            # Add Metal shader file reference
            sed -i.tmp1 '/\/\* Begin PBXFileReference section \*\//a\
            \		'"$SHADER_FILE_ID"' /* '"$SHADER_FILE"' */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = '"$FILE_TYPE"'; name = '"$SHADER_FILE"'; path = '"$SHADER_PATH"'; sourceTree = SOURCE_ROOT; };
            ' "$PROJECT_FILE"
            
            # Add build file for shader
            sed -i.tmp3 '/\/\* Begin PBXBuildFile section \*\//a\
            \		'"$SHADER_BUILD_ID"' /* '"$SHADER_FILE"' in Sources */ = {isa = PBXBuildFile; fileRef = '"$SHADER_FILE_ID"' /* '"$SHADER_FILE"' */; };
            ' "$PROJECT_FILE"
            
            # Add shader to compile sources
            awk -v shader_id="$SHADER_BUILD_ID" -v shader_name="$SHADER_FILE" '
              /\/\* Begin PBXSourcesBuildPhase section \*\// { in_sources=1 }
              in_sources && /files = \(/ { in_files=1; print; next }
              in_files && !added && /\);/ { 
                print "\t\t\t\t" shader_id " /* " shader_name " in Sources */,"
                added=1
              }
              { print }
            ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp5"
            mv "$PROJECT_FILE.tmp5" "$PROJECT_FILE"
            
            echo "✓ Added Metal shader file to build: $SHADER_FILE"
          fi
          
          # Add Metal.framework file reference
          sed -i.tmp2 '/\/\* Begin PBXFileReference section \*\//a\
          \		'"$METAL_FW_ID"' /* Metal.framework */ = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = Metal.framework; path = System/Library/Frameworks/Metal.framework; sourceTree = SDKROOT; };
          ' "$PROJECT_FILE"
          
          # Add build file for Metal framework
          sed -i.tmp4 '/\/\* Begin PBXBuildFile section \*\//a\
          \		'"$METAL_BUILD_ID"' /* Metal.framework in Frameworks */ = {isa = PBXBuildFile; fileRef = '"$METAL_FW_ID"' /* Metal.framework */; };
          ' "$PROJECT_FILE"
          
          # Add Metal.framework to link phase
          awk -v metal_id="$METAL_BUILD_ID" '
            /\/\* Begin PBXFrameworksBuildPhase section \*\// { in_frameworks=1 }
            in_frameworks && /files = \(/ { in_files=1; print; next }
            in_files && !added && /\);/ { 
              print "\t\t\t\t" metal_id " /* Metal.framework in Frameworks */,"
              added=1
            }
            { print }
          ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp6"
          mv "$PROJECT_FILE.tmp6" "$PROJECT_FILE"
          
          # Clean up temp files
          rm -f "$PROJECT_FILE".tmp*
          
          echo ""
          echo "✓ Metal.framework added to link phase"
          
          if [ "$SKIP_METAL_FILE" != "1" ] && [ -n "$SHADER_FILE" ]; then
            echo "✓ Metal shader source added to compile phase"
          else
            echo "ℹ Metal shader files not added (likely pre-compiled into SDL)"
          fi
          
          echo ""
          echo "Metal support configuration complete!"

      # ── 3. Build (unsigned — no Apple Developer account required) ────────────
      - name: Archive RSDKv5U
        run: |
          xcodebuild archive \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ runner.temp }}/RSDKv5U.xcarchive" \
            RETRO_REVISION=3 \
            INFOPLIST_FILE="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true   # xcpretty is pre-installed on macos-14 runners

      # ── 4. Package as IPA ────────────────────────────────────────────────────
      # Because the build is unsigned we skip xcodebuild -exportArchive and
      # assemble the IPA ourselves from the Products directory in the archive.
      - name: Package IPA
        run: |
          ARCHIVE="${{ runner.temp }}/RSDKv5U.xcarchive"
          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          IPA_DIR="${{ runner.temp }}/ipa"

          mkdir -p "$PAYLOAD_DIR" "$IPA_DIR"

          # Find the .app bundle produced by the archive step
          APP=$(find "$ARCHIVE/Products" -name "*.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in archive. Archive contents:"
            find "$ARCHIVE" -maxdepth 4
            exit 1
          fi

          cp -r "$APP" "$PAYLOAD_DIR/"
          cd "${{ runner.temp }}"
          zip -qr "$IPA_DIR/RSDKv5U.ipa" Payload
          echo "IPA: $IPA_DIR/RSDKv5U.ipa ($(du -sh "$IPA_DIR/RSDKv5U.ipa" | cut -f1))"

      # ── 5. Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5U-ios-unsigned
          path: ${{ runner.temp }}/ipa/RSDKv5U.ipa
          retention-days: 14

