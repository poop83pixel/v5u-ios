name: Build RSDKv5U (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - ios
  pull_request:
    branches:
      - ios

jobs:
  v5u-ios:
    name: Build RSDKv5U for iOS
    runs-on: macos-14  # Apple Silicon — fastest Xcode builds on GH Actions

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      - name: Select Xcode
        # Xcode 15+ ships on macos-14; pin a specific version if you need one.
        # Run `ls /Applications/Xcode*` on the runner to see what's available.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

                 # ── 2.5. Patch Xcode project for Metal support ───────────────────────────
      - name: Add Metal framework and shaders to Xcode project
        run: |
          PROJECT_FILE="RSDKv5.xcodeproj/project.pbxproj"
          
          # Backup original
          cp "$PROJECT_FILE" "$PROJECT_FILE.backup"
          
          echo "Searching for SDL Metal implementation files..."
          
          # Find SDL metal directory
          METAL_DIR=""
          POSSIBLE_PATHS=(
            "dependencies/ios/SDL/src/render/metal"
            "dependencies/ios/SDL2/src/render/metal"
            "dependencies/all/SDL/src/render/metal"
          )
          
          for path in "${POSSIBLE_PATHS[@]}"; do
            if [ -d "$path" ]; then
              METAL_DIR="$path"
              echo "✓ Found Metal directory: $METAL_DIR"
              break
            fi
          done
          
          if [ -z "$METAL_DIR" ]; then
            echo "ERROR: Metal directory not found!"
            find dependencies -type d -name metal 2>/dev/null | grep render || true
            exit 1
          fi
          
          echo ""
          echo "Metal directory contents:"
          ls -la "$METAL_DIR"
          echo ""
          
          # Find all Metal-related source files that need to be compiled
          METAL_FILES=()
          
          # Add SDL_render_metal.m (the main implementation)
          if [ -f "$METAL_DIR/SDL_render_metal.m" ]; then
            METAL_FILES+=("$METAL_DIR/SDL_render_metal.m")
            echo "✓ Found SDL_render_metal.m (main implementation)"
          fi
          
          # Add SDL_shaders_metal.metal (shader source)
          if [ -f "$METAL_DIR/SDL_shaders_metal.metal" ]; then
            METAL_FILES+=("$METAL_DIR/SDL_shaders_metal.metal")
            echo "✓ Found SDL_shaders_metal.metal (shader source)"
          fi
          
          if [ ${#METAL_FILES[@]} -eq 0 ]; then
            echo "ERROR: No Metal implementation files found!"
            echo "Expected: SDL_render_metal.m and/or SDL_shaders_metal.metal"
            exit 1
          fi
          
          echo ""
          echo "Files to add to Xcode project:"
          for file in "${METAL_FILES[@]}"; do
            echo "  - $(basename "$file")"
          done
          
          # Generate IDs for Metal.framework
          METAL_FW_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          METAL_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          
          echo ""
          echo "Adding files to Xcode project..."
          
          # Add each Metal source file
          for metal_file_path in "${METAL_FILES[@]}"; do
            SHADER_FILE=$(basename "$metal_file_path")
            SHADER_FILE_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            SHADER_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
            
            # Determine file type
            if [[ "$SHADER_FILE" == *.metal ]]; then
              FILE_TYPE="sourcecode.metal"
            elif [[ "$SHADER_FILE" == *.m ]]; then
              FILE_TYPE="sourcecode.c.objc"
            elif [[ "$SHADER_FILE" == *.mm ]]; then
              FILE_TYPE="sourcecode.cpp.objcpp"
            else
              FILE_TYPE="sourcecode"
            fi
            
            echo "  Adding: $SHADER_FILE"
            echo "    File ID:  $SHADER_FILE_ID"
            echo "    Build ID: $SHADER_BUILD_ID"
            echo "    Type:     $FILE_TYPE"
            
            # Add file reference
            sed -i '' '/\/\* Begin PBXFileReference section \*\//a\
            \		'"$SHADER_FILE_ID"' /* '"$SHADER_FILE"' */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = '"$FILE_TYPE"'; name = '"$SHADER_FILE"'; path = '"$metal_file_path"'; sourceTree = SOURCE_ROOT; };
            ' "$PROJECT_FILE"
            
            # Add build file
            sed -i '' '/\/\* Begin PBXBuildFile section \*\//a\
            \		'"$SHADER_BUILD_ID"' /* '"$SHADER_FILE"' in Sources */ = {isa = PBXBuildFile; fileRef = '"$SHADER_FILE_ID"' /* '"$SHADER_FILE"' */; };
            ' "$PROJECT_FILE"
            
            # Add to compile sources
            awk -v shader_id="$SHADER_BUILD_ID" -v shader_name="$SHADER_FILE" '
              /\/\* Begin PBXSourcesBuildPhase section \*\// { in_sources=1 }
              in_sources && /files = \(/ && !in_files { in_files=1; print; next }
              in_files && !added && /\);/ { 
                print "\t\t\t\t" shader_id " /* " shader_name " in Sources */,"
                added=1
              }
              { print }
            ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp"
            mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
            
            echo "    ✓ Added to project"
          done
          
          # Add Metal.framework file reference
          echo ""
          echo "  Adding Metal.framework"
          echo "    Framework ID: $METAL_FW_ID"
          echo "    Build ID:     $METAL_BUILD_ID"
          
          sed -i '' '/\/\* Begin PBXFileReference section \*\//a\
          \		'"$METAL_FW_ID"' /* Metal.framework */ = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = Metal.framework; path = System/Library/Frameworks/Metal.framework; sourceTree = SDKROOT; };
          ' "$PROJECT_FILE"
          
          # Add build file for Metal framework
          sed -i '' '/\/\* Begin PBXBuildFile section \*\//a\
          \		'"$METAL_BUILD_ID"' /* Metal.framework in Frameworks */ = {isa = PBXBuildFile; fileRef = '"$METAL_FW_ID"' /* Metal.framework */; };
          ' "$PROJECT_FILE"
          
          # Add Metal.framework to link phase
          awk -v metal_id="$METAL_BUILD_ID" '
            /\/\* Begin PBXFrameworksBuildPhase section \*\// { in_frameworks=1 }
            in_frameworks && /files = \(/ && !in_files { in_files=1; print; next }
            in_files && !added && /\);/ { 
              print "\t\t\t\t" metal_id " /* Metal.framework in Frameworks */,"
              added=1
            }
            { print }
          ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp"
          mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
          
          echo "    ✓ Added to link phase"
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "✓ Added ${#METAL_FILES[@]} Metal source file(s)"
          echo "✓ Added Metal.framework"
          echo "═══════════════════════════════════════════════════════"

          
      # ── 3. Build (unsigned — no Apple Developer account required) ────────────
      - name: Archive RSDKv5U
        run: |
          xcodebuild archive \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ runner.temp }}/RSDKv5U.xcarchive" \
            RETRO_REVISION=3 \
            INFOPLIST_FILE="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true   # xcpretty is pre-installed on macos-14 runners

      # ── 4. Package as IPA ────────────────────────────────────────────────────
      # Because the build is unsigned we skip xcodebuild -exportArchive and
      # assemble the IPA ourselves from the Products directory in the archive.
      - name: Package IPA
        run: |
          ARCHIVE="${{ runner.temp }}/RSDKv5U.xcarchive"
          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          IPA_DIR="${{ runner.temp }}/ipa"

          mkdir -p "$PAYLOAD_DIR" "$IPA_DIR"

          # Find the .app bundle produced by the archive step
          APP=$(find "$ARCHIVE/Products" -name "*.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in archive. Archive contents:"
            find "$ARCHIVE" -maxdepth 4
            exit 1
          fi

          cp -r "$APP" "$PAYLOAD_DIR/"
          cd "${{ runner.temp }}"
          zip -qr "$IPA_DIR/RSDKv5U.ipa" Payload
          echo "IPA: $IPA_DIR/RSDKv5U.ipa ($(du -sh "$IPA_DIR/RSDKv5U.ipa" | cut -f1))"

      # ── 5. Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5U-ios-unsigned
          path: ${{ runner.temp }}/ipa/RSDKv5U.ipa
          retention-days: 14

