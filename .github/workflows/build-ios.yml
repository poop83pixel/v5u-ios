name: Build RSDKv5U (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - ios
  pull_request:
    branches:
      - ios

jobs:
  v5u-ios:
    name: Build RSDKv5U for iOS
    runs-on: macos-14  # Apple Silicon — fastest Xcode builds on GH Actions

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      - name: Select Xcode
        # Xcode 15+ ships on macos-14; pin a specific version if you need one.
        # Run `ls /Applications/Xcode*` on the runner to see what's available.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

                  # ── 2.5. Patch Xcode project for Metal support ───────────────────────────
      - name: Add Metal framework and shaders to Xcode project
        run: |
          PROJECT_FILE="RSDKv5.xcodeproj/project.pbxproj"
          
          # ── Guarantee clean slate ─────────────────────────────────────────────
          echo "Resetting project file to committed state..."
          git checkout -- "$PROJECT_FILE"
          
          echo "Committed state:"
          echo "  SDL2MetalShaders: $(grep -c 'SDL2MetalShaders' "$PROJECT_FILE")"
          echo "  SDL_render_metal: $(grep -c 'SDL_render_metal' "$PROJECT_FILE")"
          echo "  Metal.framework:  $(grep -c 'Metal.framework'  "$PROJECT_FILE")"
          
          # Known phase IDs (from project inspection)
          SOURCES_PHASE_ID="F2FD447928C3E07E003A887A"
          FRAMEWORKS_PHASE_ID="F2FD447A28C3E07E003A887A"
          
          # ── Generate IDs ──────────────────────────────────────────────────────
          SHADERS_FILE_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          SHADERS_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          RENDER_FILE_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          RENDER_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          METAL_FW_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          METAL_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          
          echo ""
          echo "Generated IDs:"
          echo "  SDL2MetalShaders file:  $SHADERS_FILE_ID"
          echo "  SDL2MetalShaders build: $SHADERS_BUILD_ID"
          echo "  SDL_render_metal file:  $RENDER_FILE_ID"
          echo "  SDL_render_metal build: $RENDER_BUILD_ID"
          echo "  Metal.framework file:   $METAL_FW_ID"
          echo "  Metal.framework build:  $METAL_BUILD_ID"
          
          # ── Add file references ───────────────────────────────────────────────
          echo ""
          echo "Adding file references..."
          
          sed -i '' '/\/\* Begin PBXFileReference section \*\//a\
          \		'"$SHADERS_FILE_ID"' /* SDL2MetalShaders.mm */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = sourcecode.cpp.objcpp; name = SDL2MetalShaders.mm; path = RSDKv5/RSDK/Graphics/SDL2/SDL2MetalShaders.mm; sourceTree = SOURCE_ROOT; };\
          \		'"$RENDER_FILE_ID"' /* SDL_render_metal.m */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = sourcecode.c.objc; name = SDL_render_metal.m; path = dependencies/ios/SDL/src/render/metal/SDL_render_metal.m; sourceTree = SOURCE_ROOT; };\
          \		'"$METAL_FW_ID"' /* Metal.framework */ = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = Metal.framework; path = System/Library/Frameworks/Metal.framework; sourceTree = SDKROOT; };
          ' "$PROJECT_FILE"
          
          # ── Add build file entries ────────────────────────────────────────────
          echo "Adding build file entries..."
          
          sed -i '' '/\/\* Begin PBXBuildFile section \*\//a\
          \		'"$SHADERS_BUILD_ID"' /* SDL2MetalShaders.mm in Sources */ = {isa = PBXBuildFile; fileRef = '"$SHADERS_FILE_ID"' /* SDL2MetalShaders.mm */; };\
          \		'"$RENDER_BUILD_ID"' /* SDL_render_metal.m in Sources */ = {isa = PBXBuildFile; fileRef = '"$RENDER_FILE_ID"' /* SDL_render_metal.m */; };\
          \		'"$METAL_BUILD_ID"' /* Metal.framework in Frameworks */ = {isa = PBXBuildFile; fileRef = '"$METAL_FW_ID"' /* Metal.framework */; };
          ' "$PROJECT_FILE"
          
          # ── Add to Sources phase ──────────────────────────────────────────────
          echo "Adding SDL2MetalShaders.mm and SDL_render_metal.m to Sources phase..."
          
          awk -v phase="$SOURCES_PHASE_ID" \
              -v shaders="$SHADERS_BUILD_ID" \
              -v render="$RENDER_BUILD_ID" '
            $1 == phase { in_phase = 1 }
            in_phase && /files = \(/ {
              print
              print "\t\t\t\t" shaders " /* SDL2MetalShaders.mm in Sources */,"
              print "\t\t\t\t" render  " /* SDL_render_metal.m in Sources */,"
              next
            }
            { print }
          ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp" && mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
          
          # ── Add to Frameworks phase ───────────────────────────────────────────
          echo "Adding Metal.framework to Frameworks phase..."
          
          awk -v phase="$FRAMEWORKS_PHASE_ID" \
              -v metal="$METAL_BUILD_ID" '
            $1 == phase { in_phase = 1 }
            in_phase && /files = \(/ {
              print
              print "\t\t\t\t" metal " /* Metal.framework in Frameworks */,"
              next
            }
            { print }
          ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp" && mv "$PROJECT_FILE.tmp" "$PROJECT_FILE"
          
          # ── Final verification ────────────────────────────────────────────────
          echo ""
          echo "=== Final verification ==="
          echo "SDL2MetalShaders in Sources:   $(grep -c 'SDL2MetalShaders.mm in Sources'  "$PROJECT_FILE")"
          echo "SDL_render_metal in Sources:   $(grep -c 'SDL_render_metal.m in Sources'   "$PROJECT_FILE")"
          echo "Metal.framework in Frameworks: $(grep -c 'Metal.framework in Frameworks'   "$PROJECT_FILE")"
          echo "Metal.framework in Sources:    $(grep -c 'Metal.framework in Sources'      "$PROJECT_FILE" || echo 0)"
          
          # Fail if Metal ended up in Sources
          if grep -q "Metal.framework in Sources" "$PROJECT_FILE"; then
            echo "ERROR: Metal.framework incorrectly added to Sources phase!"
            exit 1
          fi
          
          # Fail if anything is missing
          if ! grep -q "SDL2MetalShaders.mm in Sources" "$PROJECT_FILE"; then
            echo "ERROR: SDL2MetalShaders.mm not in Sources phase!"
            exit 1
          fi
          
          if ! grep -q "Metal.framework in Frameworks" "$PROJECT_FILE"; then
            echo "ERROR: Metal.framework not in Frameworks phase!"
            exit 1
          fi
          
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "✓ Metal support configuration complete"
          echo "═══════════════════════════════════════════════════════"

      - name: Diagnose preprocessor and Metal framework
        run: |
          PROJECT_FILE="RSDKv5.xcodeproj/project.pbxproj"
          
          echo "=== GCC_PREPROCESSOR_DEFINITIONS block ==="
          awk '/GCC_PREPROCESSOR_DEFINITIONS/,/\);/' "$PROJECT_FILE" | head -30
          
          echo ""
          echo "=== Metal.framework in Frameworks phase ==="
          awk '/F2FD447A28C3E07E003A887A.*Frameworks/,/\};/' "$PROJECT_FILE" | head -30
          
          echo ""
          echo "=== All Metal.framework references ==="
          grep -n "Metal.framework" "$PROJECT_FILE"
          
          echo ""
          echo "=== SDL2MetalShaders.mm - check if TARGET_OS_IPHONE is set ==="
          head -5 RSDKv5/RSDK/Graphics/SDL2/SDL2MetalShaders.mm
      # ── 2.6. Verify Metal files are in compile sources ──────────────────────
      - name: Verify compilation setup
        run: |
          echo "Checking if Metal files will be compiled..."
          
          if grep -q "SDL2MetalShaders.mm in Sources" RSDKv5.xcodeproj/project.pbxproj; then
            echo "✓ SDL2MetalShaders.mm found in Sources phase"
          else
            echo "✗ SDL2MetalShaders.mm NOT in Sources phase"
          fi
          
          if grep -q "SDL_render_metal.m in Sources" RSDKv5.xcodeproj/project.pbxproj; then
            echo "✓ SDL_render_metal.m found in Sources phase"
          else
            echo "✗ SDL_render_metal.m NOT in Sources phase"
          fi
          
          if grep -q "Metal.framework in Frameworks" RSDKv5.xcodeproj/project.pbxproj; then
            echo "✓ Metal.framework found in Frameworks phase"
          else
            echo "✗ Metal.framework NOT in Frameworks phase"
          fi
          
      # ── 3. Build (unsigned — no Apple Developer account required) ────────────
      - name: Archive RSDKv5U
        run: |
          xcodebuild archive \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ runner.temp }}/RSDKv5U.xcarchive" \
            RETRO_REVISION=3 \
            INFOPLIST_FILE="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) TARGET_OS_IPHONE=1' \
            | xcpretty || true

      # ── 4. Package as IPA ────────────────────────────────────────────────────
      # Because the build is unsigned we skip xcodebuild -exportArchive and
      # assemble the IPA ourselves from the Products directory in the archive.
      - name: Package IPA
        run: |
          ARCHIVE="${{ runner.temp }}/RSDKv5U.xcarchive"
          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          IPA_DIR="${{ runner.temp }}/ipa"

          mkdir -p "$PAYLOAD_DIR" "$IPA_DIR"

          # Find the .app bundle produced by the archive step
          APP=$(find "$ARCHIVE/Products" -name "*.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in archive. Archive contents:"
            find "$ARCHIVE" -maxdepth 4
            exit 1
          fi

          cp -r "$APP" "$PAYLOAD_DIR/"
          cd "${{ runner.temp }}"
          zip -qr "$IPA_DIR/RSDKv5U.ipa" Payload
          echo "IPA: $IPA_DIR/RSDKv5U.ipa ($(du -sh "$IPA_DIR/RSDKv5U.ipa" | cut -f1))"

      # ── 5. Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5U-ios-unsigned
          path: ${{ runner.temp }}/ipa/RSDKv5U.ipa
          retention-days: 14

