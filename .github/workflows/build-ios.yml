name: Build RSDKv5U (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - ios
  pull_request:
    branches:
      - ios

jobs:
  v5u-ios:
    name: Build RSDKv5U for iOS
    runs-on: macos-14  # Apple Silicon — fastest Xcode builds on GH Actions

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      - name: Select Xcode
        # Xcode 15+ ships on macos-14; pin a specific version if you need one.
        # Run `ls /Applications/Xcode*` on the runner to see what's available.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── 2.5. Patch Xcode project for Metal support ───────────────────────────
      - name: Add Metal framework and shaders to Xcode project
        run: |
          PROJECT_FILE="RSDKv5.xcodeproj/project.pbxproj"
          
          # Backup original
          cp "$PROJECT_FILE" "$PROJECT_FILE.backup"
          
          # Generate unique IDs for our additions
          SHADER_FILE_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          SHADER_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          METAL_FW_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          METAL_BUILD_ID=$(openssl rand -hex 12 | tr '[:lower:]' '[:upper:]')
          
          echo "Generated IDs:"
          echo "  Shader file:     $SHADER_FILE_ID"
          echo "  Shader build:    $SHADER_BUILD_ID"
          echo "  Metal framework: $METAL_FW_ID"
          echo "  Metal build:     $METAL_BUILD_ID"
          
          # Add SDL2MetalShaders.mm file reference
          sed -i.tmp1 '/\/\* Begin PBXFileReference section \*\//a\
          \		'"$SHADER_FILE_ID"' /* SDL2MetalShaders.mm */ = {isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = sourcecode.cpp.objcpp; name = SDL2MetalShaders.mm; path = dependencies/all/SDL2/src/render/metal/SDL_render_metal.m; sourceTree = SOURCE_ROOT; };
          ' "$PROJECT_FILE"
          
          # Add Metal.framework file reference
          sed -i.tmp2 '/\/\* Begin PBXFileReference section \*\//a\
          \		'"$METAL_FW_ID"' /* Metal.framework */ = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = Metal.framework; path = System/Library/Frameworks/Metal.framework; sourceTree = SDKROOT; };
          ' "$PROJECT_FILE"
          
          # Add build file for shader
          sed -i.tmp3 '/\/\* Begin PBXBuildFile section \*\//a\
          \		'"$SHADER_BUILD_ID"' /* SDL2MetalShaders.mm in Sources */ = {isa = PBXBuildFile; fileRef = '"$SHADER_FILE_ID"' /* SDL2MetalShaders.mm */; };
          ' "$PROJECT_FILE"
          
          # Add build file for Metal framework
          sed -i.tmp4 '/\/\* Begin PBXBuildFile section \*\//a\
          \		'"$METAL_BUILD_ID"' /* Metal.framework in Frameworks */ = {isa = PBXBuildFile; fileRef = '"$METAL_FW_ID"' /* Metal.framework */; };
          ' "$PROJECT_FILE"
          
          # Add shader to compile sources (find PBXSourcesBuildPhase and add to files array)
          # This finds the first occurrence and adds our file
          awk -v shader_id="$SHADER_BUILD_ID" '
            /\/\* Begin PBXSourcesBuildPhase section \*\// { in_sources=1 }
            in_sources && /files = \(/ { in_files=1; print; next }
            in_files && !added && /\);/ { 
              print "\t\t\t\t" shader_id " /* SDL2MetalShaders.mm in Sources */,"
              added=1
            }
            { print }
          ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp5"
          mv "$PROJECT_FILE.tmp5" "$PROJECT_FILE"
          
          # Add Metal.framework to link phase (find PBXFrameworksBuildPhase)
          awk -v metal_id="$METAL_BUILD_ID" '
            /\/\* Begin PBXFrameworksBuildPhase section \*\// { in_frameworks=1 }
            in_frameworks && /files = \(/ { in_files=1; print; next }
            in_files && !added && /\);/ { 
              print "\t\t\t\t" metal_id " /* Metal.framework in Frameworks */,"
              added=1
            }
            { print }
          ' "$PROJECT_FILE" > "$PROJECT_FILE.tmp6"
          mv "$PROJECT_FILE.tmp6" "$PROJECT_FILE"
          
          # Clean up temp files
          rm -f "$PROJECT_FILE".tmp*
          
          echo "✓ Metal support added to Xcode project"

      # ── 3. Build (unsigned — no Apple Developer account required) ────────────
      - name: Archive RSDKv5U
        run: |
          xcodebuild archive \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ runner.temp }}/RSDKv5U.xcarchive" \
            RETRO_REVISION=3 \
            INFOPLIST_FILE="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true   # xcpretty is pre-installed on macos-14 runners

      # ── 4. Package as IPA ────────────────────────────────────────────────────
      # Because the build is unsigned we skip xcodebuild -exportArchive and
      # assemble the IPA ourselves from the Products directory in the archive.
      - name: Package IPA
        run: |
          ARCHIVE="${{ runner.temp }}/RSDKv5U.xcarchive"
          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          IPA_DIR="${{ runner.temp }}/ipa"

          mkdir -p "$PAYLOAD_DIR" "$IPA_DIR"

          # Find the .app bundle produced by the archive step
          APP=$(find "$ARCHIVE/Products" -name "*.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in archive. Archive contents:"
            find "$ARCHIVE" -maxdepth 4
            exit 1
          fi

          cp -r "$APP" "$PAYLOAD_DIR/"
          cd "${{ runner.temp }}"
          zip -qr "$IPA_DIR/RSDKv5U.ipa" Payload
          echo "IPA: $IPA_DIR/RSDKv5U.ipa ($(du -sh "$IPA_DIR/RSDKv5U.ipa" | cut -f1))"

      # ── 5. Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5U-ios-unsigned
          path: ${{ runner.temp }}/ipa/RSDKv5U.ipa
          retention-days: 14

